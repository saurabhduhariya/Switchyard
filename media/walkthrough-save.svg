<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" fill="none">
  <rect width="400" height="240" rx="8" fill="#1e1e1e"/>
  <!-- Central notification toast / card -->
  <rect x="70" y="50" width="260" height="140" rx="10" fill="#252526" stroke="#007fd4" stroke-width="1.5"/>
  <!-- Avatar icon -->
  <circle cx="120" cy="100" r="22" fill="#0e639c"/>
  <circle cx="120" cy="94" r="8" fill="#ffffff"/>
  <path d="M106 114c0-4 4-8 14-8s14 4 14 8" fill="#ffffff"/>
  <!-- Text info -->
  <text x="156" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="600" fill="#ffffff">Active Account Detected</text>
  <text x="156" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" fill="#3794ff">user@gmail.com</text>
  <!-- Save button -->
